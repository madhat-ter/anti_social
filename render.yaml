# Render Blueprint for a FREE test deploy (see docs/deploy-free.md): the API plus its Postgres.
# Render wires DATABASE_URL itself, so nothing secret is typed anywhere.
# Free Postgres on Render expires 30 days after creation; fine for testing, not for launch.
databases:
  - name: anti-db
    plan: free
    region: singapore
    databaseName: anti
    user: anti
    postgresMajorVersion: "17"

services:
  - type: web
    name: anti-api
    runtime: docker
    plan: free
    region: singapore # same region as the database
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anti-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: RP_ID # the web app's host (Vercel production domain)
        value: anti-social-opal.vercel.app
      - key: WEB_ORIGIN
        value: https://anti-social-opal.vercel.app
      - key: MIGRATE_ON_BOOT
        value: "true"
      - key: STORAGE # images in Postgres: the free plan has no disk
        value: db
      - key: PAYMENTS
        value: fake
      - key: ALLOW_FAKE_PAYMENTS # test deploy only: nobody is charged
        value: "true"
      - key: TRUST_PROXY
        value: "true"
