# Watches the live test site. When the API is down (Render answers 502 with
# X-Render-Routing: no-deploy, see docs/deploy-free.md; or any 5xx, or no answer within 60 s),
# it pushes an empty commit to main. Render deploys every push, so that brings the API back,
# exactly like the manual fix. No secret is needed: it uses the workflow's own GITHUB_TOKEN.
# The check also usually keeps the free instance from sleeping. Two bad checks in a row are
# needed, so a brief deploy in progress is not treated as an outage. If the last three commits
# on main are already its own redeploys, it stops and fails instead (the code itself is likely
# broken); GitHub then emails the owner.
name: uptime-watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://anti-social-opal.vercel.app/api/health
      MARK: "Redeploy (uptime-watch): API was down"
    steps:
      - name: Check the API through the web app
        id: check
        run: |
          check() {
            : > /tmp/headers.txt
            curl -s -o /dev/null -D /tmp/headers.txt --max-time 60 "$HEALTH_URL" || true
            code=$(head -n1 /tmp/headers.txt | awk '{print $2}')
            routing=$(grep -i '^x-render-routing:' /tmp/headers.txt | tr -d '\r' | awk '{print $2}')
            echo "status=${code:-none} routing=$routing"
            # no-deploy is the known outage; a 502/503/504 or no answer at all (API hung) counts too
            case "$code" in
              2*|3*|4*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if check; then
            echo "up"
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "looks down; waiting 90 s and checking again"
            sleep 90
            if check; then
              echo "back up on the second check"
              echo "down=false" >> "$GITHUB_OUTPUT"
            else
              echo "down=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Get main
        if: steps.check.outputs.down == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3

      - name: Push an empty commit so Render deploys again
        if: steps.check.outputs.down == 'true'
        run: |
          own=$(git log -3 --format=%s | grep -cF "$MARK" || true)
          if [ "$own" -ge 3 ]; then
            echo "The last three commits are already redeploys and the API is still down."
            echo "Not pushing again: look at Render → anti-api → Events and Logs."
            exit 1
          fi
          git config user.name "uptime-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "$MARK ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:main
          echo "pushed; Render should be back in about 3 minutes"
